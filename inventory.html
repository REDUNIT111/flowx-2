<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowX - Buy Inventory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#mainContent">Skip to main content</a>

    <header>
        <div class="brand">
            <img src="flowx-icon.png" alt="FlowX logo">
            <h1>FlowX</h1>
        </div>
        <p>Buy available excess inventory.</p>
    </header>

    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">🏠 Dashboard</a>
        <a href="seller.html">📦 Seller</a>
        <a href="inventory.html" class="current" aria-current="page">🛒 Buy Inventory</a>
        <a href="transport.html">🚚 Transporter</a>
        <a href="transactions.html">📊 Transactions</a>
    </nav>

    <main id="mainContent" tabindex="-1">

        <div class="flowx-navigation" role="group" aria-label="Inventory views">
            <button id="browseInventoryBtn" class="active" aria-pressed="true" onclick="showInventory()">
                🛒 Browse Inventory
            </button>
            <button id="buyerRequestStatusBtn" aria-pressed="false" onclick="showBuyerRequestStatus()">
                📋 Request Status
            </button>
        </div>

        <!-- INVENTORY -->

        <div id="message"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
